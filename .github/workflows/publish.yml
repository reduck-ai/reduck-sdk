# Releases the package and stages it on npm, where a maintainer approves it before anyone can
# install it. The version is never committed: npm and the tag v<version> hold it, and package.json
# keeps 0.0.0. The last version is the highest of npm's and the tags'.
#
# - main (job `latest`): each push that changes what the package ships, under the npm tag
#   `latest`. The last version, increased: major when oasdiff finds a breaking change between its
#   spec and this one, or when it has no spec to compare with; minor when the spec changed
#   otherwise; patch for anything else. Run it by hand (Actions > Publish > Run workflow) to
#   choose the increment, for example a major version for a breaking change in src/client.ts.
#
# - staging (job `next`): each push, under the npm tag `next`, as x.y.z-next.N. Nobody edits
#   staging by hand: it is main plus one commit that replaces openapi.json with the spec of the
#   API's next release, so `next` holds the routes that are not in production yet. x.y.z is the
#   last stable version increased as the job `latest` would for this spec against main's; N
#   follows the tags of x.y.z's prereleases.
#
# npm trusts this workflow by its file name (Trusted Publishing, OIDC; no NPM_TOKEN): renaming
# publish.yml stops publishing until the package's Trusted Publisher on npmjs.com is updated.

name: Publish

on:
  push:
    branches: [main, staging]
    paths:
      - 'src/**'
      - 'openapi.json'
      - 'openapi-ts.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      # The tag and the GitHub release.
      contents: write
      # The OIDC token npm exchanges for publishing. Add --provenance to `npm stage publish` once
      # the repository is public: npm signs provenance only for a public source repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # npm trusted publishing needs npm >= 11.5.1, which Node 22 does not ship. No registry-url:
      # it writes an _authToken line npm would use instead of OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # After setup-node, and without its own Node: either order or a second Node breaks OIDC.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
          node-version-file: false
      # `npm stage` needs npm >= 11.15.0.
      - run: npm install -g npm@11.15.0
      - run: pnpm install --frozen-lockfile

      - name: Choose the version
        id: version
        env:
          INCREMENT: ${{ inputs.increment || 'auto' }}
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          # A staged version is not on npm until a maintainer approves it, but its tag exists: the
          # last version is the highest of the two, so two releases waiting for approval never
          # take the same number.
          current=$(npm view "$name" version)
          tagged=$(git tag -l 'v*' | sed 's/^v//' | { grep -v -- '-' || true; } | sort -V | tail -1)
          if [ -n "$tagged" ] && [ "$(printf '%s\n%s\n' "$current" "$tagged" | sort -V | tail -1)" = "$tagged" ]; then current=$tagged; fi
          echo "last version: $name@$current"

          if [ "$INCREMENT" = auto ] && git rev-parse -q --verify "refs/tags/v$current" >/dev/null \
              && git diff --quiet "v$current" HEAD -- src openapi.json openapi-ts.config.ts 'tsconfig*.json' package.json pnpm-lock.yaml README.md; then
            echo "Nothing changed since v$current."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          increment=$INCREMENT
          if [ "$increment" = auto ]; then
            # The spec of the last version: from its tag, or from npm for one released before
            # this repository.
            mkdir -p "$RUNNER_TEMP/prev/package"
            if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
              git show "v$current:openapi.json" > "$RUNNER_TEMP/prev/package/openapi.json"
            else
              (cd "$RUNNER_TEMP/prev" && npm pack "$name@$current" --silent >/dev/null && tar -xzf ./*.tgz)
            fi
            prev="$RUNNER_TEMP/prev/package/openapi.json"
            # A version published before the spec was committed: nothing to compare with, and
            # the SDK it holds is not this one.
            if [ ! -f "$prev" ]; then
              increment=major
            elif cmp -s "$prev" openapi.json; then
              increment=patch
            elif docker run --rm -v "$RUNNER_TEMP/prev/package:/old" -v "$PWD:/new" tufin/oasdiff:v1.39.0 \
                breaking /old/openapi.json /new/openapi.json --fail-on ERR; then
              increment=minor
            else
              increment=major
            fi
          fi

          next=$(npx -y semver@7.7.3 -i "$increment" "$current")
          echo "$current -> $next ($increment)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip != 'true'
        run: pnpm check && pnpm test

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          npm stage publish --access public
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --verify-tag
          echo "::notice::v$VERSION is staged on npm: a maintainer approves it (npmjs.com, or npm stage approve) before anyone can install it."

  next:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      # The tag v<version>.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
          node-version-file: false
      # `npm stage` needs npm >= 11.15.0.
      - run: npm install -g npm@11.15.0
      - run: pnpm install --frozen-lockfile

      - name: Choose the version
        id: version
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          stable=$(npm view "$name" version)
          tagged=$(git tag -l 'v*' | sed 's/^v//' | { grep -v -- '-' || true; } | sort -V | tail -1)
          if [ -n "$tagged" ] && [ "$(printf '%s\n%s\n' "$stable" "$tagged" | sort -V | tail -1)" = "$tagged" ]; then stable=$tagged; fi
          git show origin/main:openapi.json > "$RUNNER_TEMP/main.json"
          mkdir -p "$RUNNER_TEMP/stable/package"
          if git rev-parse -q --verify "refs/tags/v$stable" >/dev/null; then
            git show "v$stable:openapi.json" > "$RUNNER_TEMP/stable/package/openapi.json"
          else
            (cd "$RUNNER_TEMP/stable" && npm pack "$name@$stable" --silent >/dev/null && tar -xzf ./*.tgz)
          fi
          # The stable version predates the committed spec: the next one is a major one anyway.
          if [ ! -f "$RUNNER_TEMP/stable/package/openapi.json" ]; then
            increment=major
          elif cmp -s "$RUNNER_TEMP/main.json" openapi.json; then
            increment=patch
          elif docker run --rm -v "$RUNNER_TEMP:/old" -v "$PWD:/new" tufin/oasdiff:v1.39.0 \
              breaking /old/main.json /new/openapi.json --fail-on ERR; then
            increment=minor
          else
            increment=major
          fi
          base=$(npx -y semver@7.7.3 -i "$increment" "$stable")
          n=$(git tag -l "v$base-next.*" | wc -l)
          next="$base-next.$((n + 1))"
          echo "$stable -> $next ($increment against main)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - run: pnpm check && pnpm test

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          npm stage publish --access public --tag next
          git tag "v$VERSION"
          git push origin "v$VERSION"
